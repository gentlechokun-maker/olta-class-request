<!doctype html><html lang="ko"><head><base target="_blank"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font:13px/1.6 system-ui,sans-serif;margin:0;background:#f6f8f1;color:#233d35}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:#174c3e;color:white}h1{font-size:20px;margin:0}h2{font-size:18px;margin:12px 0}button{cursor:pointer;background:#174c3e;color:white;border:0;border-radius:5px;padding:9px 13px;font:inherit}button:disabled{opacity:.5}header button{background:#e5edd0;color:#174c3e}nav{display:flex;gap:8px;padding:18px 24px;border-bottom:1px solid #dce4d5}nav button{background:#e6eddc;color:#45603e}nav button.active{background:#174c3e;color:white}main{padding:20px 24px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;vertical-align:top;padding:11px;border-bottom:1px solid #e0e6db;font-size:12px}th{background:#eaf0e0;font-weight:600}small{font-size:10px;color:#73836d}.pill{display:inline-block;border-radius:5px;padding:3px 7px;background:#e8efde;color:#426342}.warn{background:#fff0d4;color:#845c1c}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions button{font-size:11px;padding:5px 8px}.secondary{background:#e9eedf;color:#4c6540}.danger{background:#f7e9e5;color:#925444}#status{padding:10px 24px;background:#eef3e5;min-height:40px}.hint{padding:12px 15px;background:#eaf0dd;border-radius:6px;margin-bottom:16px}.stats{display:flex;gap:12px;margin-bottom:20px}.stat{flex:1;background:white;border:1px solid #e0e6db;border-radius:9px;padding:15px}.stat strong{font-size:25px;display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:white;border:1px solid #e0e6db;padding:18px;border-radius:9px}label{display:block;margin:10px 0;font-size:12px}input,select,textarea{display:block;font:inherit;padding:8px;border:1px solid #ccd9c2;border-radius:5px;width:100%;margin-top:4px}dialog{border:1px solid #d7e1ce;border-radius:12px;width:500px;padding:24px;box-shadow:0 20px 70px #174c3e33}dialog::backdrop{background:#153d3360}a{color:#174c3e}.empty{padding:30px;text-align:center;color:#798673}.issue{white-space:pre-line;font-size:11px;color:#956030}#dashboard{overflow:auto}.nowrap{white-space:nowrap}.check{display:flex;align-items:flex-start;gap:8px}.check input{width:auto;margin-top:4px}
</style></head><body><header><div><h1>올타과학 · 상담과 운영</h1><small style="color:#c8d8c0">비공개 관리자 화면 · 학생 이름과 연락처는 공개되지 않습니다.</small></div><div><button onclick="refresh()">새로고침</button> <button onclick="sync()">시간표 동기화</button></div></header><div id="status" role="status">불러오는 중…</div><nav><button class="active" data-tab="requests">상담 신청</button><button data-tab="demand">새 반 개설 수요</button><button data-tab="capacity">반별 정원·검토</button><button data-tab="makeupRequests">보강 신청 접수</button><button data-tab="makeups">날짜별 보강</button><button data-tab="pauses">휴원 연락</button></nav><main id="dashboard"></main>
<dialog id="confirm-dialog"><h2>시간표 등록 확인 후 확정</h2><p>먼저 원본 시간표에 원생을 검정 또는 보라색으로 등록하세요. 신청자와 시간표 원생이 같은 사람인지 상담 내용으로 확인하세요.</p><form id="confirm-form"><input name="id" type="hidden"><label>등록한 반<select name="classId" required></select></label><label>시간표의 원생<select name="student" required></select></label><label class="check"><input name="identity" type="checkbox" required><span>상담 내용으로 신청자와 시간표 원생이 같은 사람임을 확인했습니다.</span></label><div class="row-actions"><button type="submit">원본을 다시 읽고 확정</button><button type="button" class="secondary" onclick="this.closest('dialog').close()">닫기</button></div></form></dialog>
<dialog id="makeup-approval-dialog"><h2>보강 일정 확인 후 확정</h2><p id="makeup-approval-summary"></p><form id="makeup-approval"><input name="id" type="hidden"><label>실제 보강 담당 선생님<input name="teacher" maxlength="40" required placeholder="반설정과 동일한 표기, 예: 홍T"></label><label>실제 보강 교실<input name="room" maxlength="40" required placeholder="반설정과 동일한 표기, 예: 2교실"></label><label class="check"><input name="verified" type="checkbox" required><span>보호자 상담으로 재원생 본인임을 확인했으며, 선생님의 근무·이동 시간과 교실 사용 일정을 확인했습니다.</span></label><button type="submit">일정 검증 후 확정</button> <button type="button" onclick="this.closest('dialog').close()">닫기</button></form></dialog><script>
let data=null,tab='requests',busy=false;const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>s?String(s).slice(0,10):'—';
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));}
function status(s){$('#status').textContent=s;}async function action(name,...args){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);status('처리 중…');try{await call(name,...args);await refresh();status('처리했습니다.');}catch(e){status(e.message||String(e));}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
async function refresh(){try{data=await call('getAdminDashboard');data.makeupRequests=await call('getMakeupRequests');render();status('최근 시간표 확인: '+(data.lastSync?new Date(data.lastSync).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'동기화 전'));}catch(e){status(e.message||String(e));}}async function sync(){await action('syncTimetable');}
function courseGrade(grade){return grade;}
function title(id){const c=data.classes.find(c=>c.id===id);return c?c.grade+' '+c.day+' '+c.start+' '+c.title:id;}
function table(headers,rows){return rows.length?'<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>':'<div class="empty">등록된 기록이 없습니다.</div>';}
function button(label,fn,id,style=''){return '<button class="'+style+'" data-action="'+fn+'" data-id="'+esc(id)+'">'+label+'</button>';}
function render(){if(!data)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';
if(tab==='requests'){const requests=[...data.requests].reverse();out='<div class="stats"><div class="stat">신규 접수<strong>'+requests.filter(r=>r.status==='접수').length+'</strong></div><div class="stat">상담 중<strong>'+requests.filter(r=>r.status==='상담 중').length+'</strong></div><div class="stat">시간표 재확인<strong>'+requests.filter(r=>r.status==='시간표 재확인').length+'</strong></div></div><div class="hint">신청은 자리를 차감하지 않습니다. 상담 후 시간표에 등록하고, <b>시간표 확인</b>으로 확정하세요. 이름이 같아도 본인 확인이 필요합니다.</div>'+table(['접수일·상태','원생·연락처','희망 수업','참고 내용','처리'],requests.map(r=>'<tr><td>'+date(r.createdAt)+'<br><span class="pill">'+esc(r.status)+'</span></td><td>'+esc(r.student)+' · '+esc(r.grade)+'<br><a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a></td><td>'+(r.kind==='new'?'새 반 요청<br>':'')+esc(title(r.targetId))+'</td><td>'+esc(r.note)+'</td><td><div class="row-actions">'+(r.status==='취소'?'':button('상담 중','consult',r.id,'secondary')+button('시간표 확인','confirm',r.id)+button('취소','cancel',r.id,'danger'))+'</div></td></tr>'));}
if(tab==='makeupRequests')out=renderMakeupRequests();
if(tab==='demand'){out='<div class="hint">동일 학년·동일 시간대의 중복 없는 희망 원생이 <b>3명 이상</b>이면 개설 검토 대상입니다. 자동 개설하지 않습니다.</div>';const rows=Object.entries(data.catalog.demand||{}).map(([key,count])=>{const [id,grade]=key.split('|');const slot=data.catalog.slots.find(s=>s.id===id);return '<tr><td>'+esc(grade)+'</td><td>'+esc(slot?slot.day+' '+slot.start+'–'+slot.end+' '+slot.room:id+' (현재 모집 중지)')+'</td><td><b>'+count+'명</b></td><td><span class="pill '+(count<3?'warn':'')+'">'+(count>=3?'개설 검토 대상':'3명까지 '+(3-count)+'명')+'</span></td></tr>';});out+=table(['학년','희망 시간대','희망 원생','상태'],rows);}
if(tab==='capacity'){out='<div class="hint">반설정 시트의 이름 범위에는 수업 제목과 메모를 제외하세요. 검정·보라만 정규 자리를 차감합니다. 알 수 없는 색·중복 이름·시간 겹침은 확인 중으로 처리합니다.</div>'+table(['반','등록 / 시작 예정','휴원 / 상담 / 보강','정규 잔여석','확인 사항'],data.classes.map(c=>{const s=data.summaries.find(s=>s.classId===c.id);return '<tr><td>'+esc(title(c.id))+'<br>'+esc(c.room)+' · '+esc(c.sourceRange)+'</td><td>'+(s?esc(s.registered)+' / '+esc(s.starting):'—')+'</td><td>'+(s?esc(s.paused)+' / '+esc(s.consultation)+' / '+esc(s.makeup):'—')+'</td><td>'+(s&&s.review!=='true'?Math.max(0,6-Number(s.registered)-Number(s.starting))+'명':'확인 중')+'</td><td class="issue">'+esc(s?s.issues:'동기화 전')+'</td></tr>';}));}
if(tab==='makeups'){const blue=data.roster.filter(p=>p.status==='makeup');const undated=blue.filter(p=>!data.makeups.some(m=>m.classId===p.classId&&m.student===p.name&&m.status==='배정'&&m.date>=data.today));out='<div class="hint">보강은 날짜별로 배정합니다. 파란 이름만으로는 날짜를 알 수 없어 먼저 보강 날짜를 입력해야 합니다. 날짜가 없는 파란 원생은 안전을 위해 보강 배정 검사에서 임시로 자리를 차지합니다.</div>'+(undated.length?'<p class="issue">날짜 확인 필요: '+undated.map(p=>esc(p.name)+' ('+esc(title(p.classId))+')').join(', ')+'</p>':'')+'<div class="panel"><form id="makeup-form"><div class="grid"><label>보강할 반<select name="classId">'+data.classes.map(c=>'<option value="'+esc(c.id)+'">'+esc(title(c.id))+'</option>').join('')+'</select></label><label>보강 날짜<input type="date" name="date" min="'+data.today+'" required></label><label>원생 이름<input name="student" required maxlength="30"></label></div><button>정원 확인 후 보강 배정</button></form></div><h2>보강 기록</h2>'+table(['날짜','원생','반','상태','처리'],data.makeups.map(m=>'<tr><td>'+esc(m.date)+'</td><td>'+esc(m.student)+'</td><td>'+esc(title(m.classId))+'</td><td>'+esc(m.status)+'</td><td>'+(m.status==='배정'?button('배정 취소','cancelMakeup',m.id,'danger'):'')+'</td></tr>'));}
if(tab==='pauses'){out='<div class="hint">빨간 원생은 자리를 차지하지 않습니다. 종료일이 지나도 자동 복귀시키지 않으며, 연락 후 시간표의 글자색을 변경합니다. 휴원 시작일은 최초 감지일이므로 실제 날짜로 수정하세요.</div>'+data.pauses.map((p,i)=>'<form class="panel pause-form" data-index="'+i+'" style="margin-bottom:12px"><h2>'+esc(p.student)+' <small>'+esc(title(p.classId))+'</small> '+(p.followUp&&p.followUp<=data.today&&(!p.contactedAt||p.contactedAt.slice(0,10)<p.followUp)?'<span class="pill warn">연락 필요</span>':'')+'</h2><div class="grid"><label>휴원 시작<input type="date" name="pauseStart" value="'+esc(p.pauseStart)+'"></label><label>휴원 종료 예정<input type="date" name="pauseEnd" value="'+esc(p.pauseEnd)+'"></label><label>연락 예정<input type="date" name="followUp" value="'+esc(p.followUp)+'"></label><label>상담 메모<input name="note" maxlength="300" value="'+esc(p.note)+'"></label></div><label class="check"><input type="checkbox" name="contacted">오늘 연락 완료로 기록</label><button>기록 저장</button> <small>최근 연락: '+esc(p.contactedAt||'없음')+'</small></form>').join('');if(!data.pauses.length)out+='<div class="empty">휴원 원생 기록이 없습니다.</div>';}
$('#dashboard').innerHTML=out;}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();}const id=b.dataset.id;if(b.dataset.action==='consult')action('updateRequest',id,'상담 중');if(b.dataset.action==='cancel'&&confirm('이 상담 신청을 취소하시겠습니까? 시간표는 변경되지 않습니다.'))action('updateRequest',id,'취소');if(b.dataset.action==='cancelMakeup'&&confirm('보강 배정을 취소하시겠습니까?'))action('cancelMakeup',id);if(b.dataset.action==='confirm'){const r=data.requests.find(r=>r.id===id);const f=$('#confirm-form');f.reset();f.elements.id.value=id;f.elements.classId.innerHTML=data.classes.filter(c=>courseGrade(c.grade)===courseGrade(r.grade)).map(c=>'<option value="'+esc(c.id)+'">'+esc(title(c.id))+'</option>').join('');if(data.classes.some(c=>c.id===r.targetId&&courseGrade(c.grade)===courseGrade(r.grade)))f.elements.classId.value=r.targetId;updateRoster();$('#confirm-dialog').showModal();}});
function updateRoster(){const f=$('#confirm-form');f.elements.student.innerHTML=data.roster.filter(p=>p.classId===f.elements.classId.value&&['registered','starting'].includes(p.status)).map(p=>'<option value="'+esc(p.name)+'">'+esc(p.name)+' · '+(p.status==='registered'?'확정 등록':'시작 예정')+'</option>').join('');}
$('#confirm-form').elements.classId.onchange=updateRoster;
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id==='confirm-form'){if(!f.elements.student.value){status('이 반에 검정·보라 원생이 없습니다.');return;}const args=[f.elements.id.value,f.elements.classId.value,f.elements.student.value];$('#confirm-dialog').close();await action('confirmFromTimetable',...args);}if(f.id==='makeup-form')await action('addMakeup',f.elements.classId.value,f.elements.student.value,f.elements.date.value);if(f.classList.contains('pause-form')){const p=data.pauses[Number(f.dataset.index)];await action('savePause',{classId:p.classId,student:p.student,pauseStart:f.elements.pauseStart.value,pauseEnd:f.elements.pauseEnd.value,followUp:f.elements.followUp.value,note:f.elements.note.value,contacted:f.elements.contacted.checked});}});
function renderMakeupRequests(){return '<div class="hint">정규 수업 전후의 별도 보강 신청입니다. 실험 30분·이론 60분, 오후 10시 종료. 상담으로 본인 여부를 확인하고 실제 보강 선생님과 교실을 지정하세요. 정규반 정원은 차감하지 않습니다.</div>'+table(['원생·연락처','정규반','보강 희망','메모·상태','처리'],[...(data.makeupRequests||[])].reverse().map(r=>'<tr><td>'+esc(r.student)+' · '+esc(r.grade)+'<br>'+esc(r.phone)+'</td><td>'+esc(title(r.targetId))+'</td><td>'+esc(r.date)+'<br>'+esc(r.start)+'–'+esc(r.end)+'<br>'+(r.makeupType==='experiment'?'실험 30분':'이론 1시간')+' · '+(r.position==='before'?'수업 전':'수업 후')+'</td><td>'+esc(r.note)+'<br>'+esc(r.status)+'<br>'+esc(r.teacher||'')+' '+esc(r.room||'')+'</td><td>'+(r.status==='취소'?'':button('상담 중','makeupConsult',r.id,'secondary')+button('일정 확인·확정','makeupConfirm',r.id)+button('취소','makeupCancel',r.id,'danger'))+'</td></tr>'));}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;if(b.dataset.action==='makeupConsult')action('reviewMakeupRequest',id,'상담 중');if(b.dataset.action==='makeupCancel'&&confirm('보강 신청을 취소하시겠습니까?'))action('reviewMakeupRequest',id,'취소');if(b.dataset.action==='makeupConfirm'){const r=data.makeupRequests.find(r=>r.id===id),f=$('#makeup-approval');f.reset();f.elements.id.value=id;$('#makeup-approval-summary').textContent=r.student+' · '+r.date+' '+r.start+'–'+r.end;$('#makeup-approval-dialog').showModal();}});
$('#makeup-approval').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;const args=[f.elements.id.value,'확정',f.elements.teacher.value,f.elements.room.value,f.elements.verified.checked];$('#makeup-approval-dialog').close();await action('reviewMakeupRequest',...args);});
refresh();
</script></body></html>
