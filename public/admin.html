<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="./theme.css?v=20261031-type"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>관리자 안내 · 올타과학</title><link rel="stylesheet" href="./booking.css?v=20261031-type"></head><body><main><a href="./">← 수업 안내</a><section><h1>통합 관리자</h1><p>등록된 관리자 Google 계정으로 로그인한 브라우저에서 열어 주세요. 설명회·상담·수강 신청·결석과 보강을 한 화면에서 확인할 수 있습니다.</p><p><a id="admin-link" hidden target="_blank" rel="noopener">통합 관리자 화면 열기 ↗</a></p><p id="admin-note">서버 연결 설정을 확인하고 있습니다.</p><hr><p>원본 시간표에 파란 글씨로 적힌 보강은 관리자 화면의 <b>날짜별 보강</b>에서 확인할 수 있습니다. 해당 항목을 열면 원본을 다시 읽습니다.</p><p>처음 설치할 때만 Apps Script에서 <code>setupBookings</code>를 실행합니다.</p></section></main><script src="./config.js"></script><script>const url=window.OLTA_CONFIG?.apiUrl;if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url||'')){const a=document.getElementById('admin-link');a.href=url+'?action=admin';a.hidden=false;document.getElementById('admin-note').textContent='권한이 없는 계정에는 신청 내역이 표시되지 않습니다.';}else document.getElementById('admin-note').textContent='운영 서버 주소를 설정한 후 사용할 수 있습니다.';</script></body></html>
