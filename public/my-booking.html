<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>보강 예약 조회·취소 | 올타과학</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./theme.css?v=20261015-review"><link rel="stylesheet" href="./booking.css?v=20261021-portal"><link rel="stylesheet" href="./my-booking.css?v=20261021-portal"><script src="./config.js"></script><script type="module" src="./my-booking.js?v=20261021-portal"></script></head>
<body><header><a href="./"><img src="./olta-logo.png" alt="올타 수학과학 학원"></a><a href="./">수업 안내로 돌아가기 ↗</a></header>
<main><p class="eyebrow">OLTA SCIENCE · 내 예약 확인</p><h1>보강 예약 조회·취소</h1><p>결석·보강 예약의 접수·확정·완료 상태와 일정을 확인할 수 있습니다.</p>
<section aria-labelledby="lookup-heading"><h2 id="lookup-heading">예약 조회</h2><p class="muted">신청 완료 화면에서 받은 접수번호와 확인 코드를 입력해 주세요. 기존 신청도 조회할 수 있습니다. 코드를 잃어버렸다면 학원으로 문의해 주세요.</p>
<form id="lookup-form" method="post" autocomplete="off"><input type="hidden" name="kind" value="makeup_lookup"><input name="website" tabindex="-1" autocomplete="off" class="trap" aria-hidden="true">
<label>접수번호<input name="id" required minlength="16" maxlength="64" pattern="[a-zA-Z0-9-]{16,64}" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
<label>확인 코드<input name="token" type="password" required minlength="32" maxlength="64" pattern="[a-fA-F0-9]{32,64}" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
<button type="submit" id="lookup-button">예약 상태 조회하기</button><p id="lookup-status" role="status" aria-live="polite"></p></form></section>
<section id="booking-result" aria-labelledby="result-heading" hidden tabindex="-1"><h2 id="result-heading">신청 결과</h2><p><strong id="booking-status" class="portal-status"></strong></p><p id="status-guide"></p><dl id="booking-details" class="portal-details"></dl>
<form id="cancel-booking-form" hidden><label class="consent"><input type="checkbox" name="confirmCancel" value="yes" required><span>위 결석·보강 예약을 취소하겠습니다.</span></label><button type="submit" id="cancel-button" class="portal-cancel">이 예약 취소하기</button></form><p id="cancel-status" role="status" aria-live="polite"></p><button type="button" id="refresh-booking" class="secondary-button">현재 상태 새로 확인</button></section>
<footer><p>올타과학 · <a href="tel:01057256442">010-5725-6442</a></p><a href="./booking.html?kind=absence">결석·보강 예약하기</a></footer></main></body></html>
